<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tangkap Nyamuk! 5 Kelompok</title>
<style>
:root{--bg:#e8f7e4;--card:#fff;--ink:#23304a;--soft:#dff0da;--sky:#cfeeff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14221a;--card:#1f3326;--ink:#eaf7e6;--soft:#2a4333;--sky:#1d3b4d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14221a;--card:#1f3326;--ink:#eaf7e6;--soft:#2a4333;--sky:#1d3b4d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:820px;padding:12px;text-align:center}
h1{font-size:2rem;margin:6px 0}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 5px 0 rgba(0,0,0,.12);margin:10px 0}
.btn{border:0;border-radius:18px;padding:14px 28px;font:inherit;font-size:1.3rem;color:#fff;background:#16a34a;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);margin:8px 4px}
.btn:active{transform:translateY(3px);box-shadow:none}
.opt{border:3px solid #16a34a;background:var(--card);color:var(--ink);border-radius:14px;padding:8px 16px;font:inherit;font-size:1.1rem;cursor:pointer;margin:0 4px}
.opt.on{background:#16a34a;color:#fff}
.hide{display:none!important}
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{border-radius:14px;padding:6px 2px;font-size:.9rem;font-weight:700;border:4px solid transparent;opacity:.7}
.t b{display:block;font-size:1.5rem}
.t.act{opacity:1;border-color:var(--ink);transform:scale(1.08)}
.banner{border-radius:16px;font-size:1.5rem;font-weight:700;padding:8px;margin:10px 0}
.sent{font-size:1.7rem;font-weight:700;margin:6px 0}
.blank{display:inline-block;min-width:3.5em;border-bottom:4px dashed currentColor}
.bar{height:12px;background:var(--soft);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:#f59e0b;transition:width 1s linear}
.arena{position:relative;height:330px;border-radius:22px;background:linear-gradient(var(--sky),var(--soft));overflow:hidden;margin-top:10px;touch-action:manipulation}
.mq{position:absolute;left:0;top:0;width:120px;cursor:pointer;user-select:none;-webkit-user-select:none}
.mq .bug{display:block;font-size:3.4rem;line-height:1}
.mq .lab{display:inline-block;background:#fff;color:#23304a;border-radius:12px;padding:3px 10px;font-weight:700;font-size:1.25rem;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mq.right .lab{background:#22c55e;color:#fff}
.mq.dead .bug{font-size:4rem}
.msg{font-size:1.4rem;font-weight:700;min-height:2em;margin-top:8px}
.rank{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 14px;margin:8px 0;font-size:1.3rem;font-weight:700}
.rank b{margin-left:auto}
.tip{background:var(--soft);border-radius:14px;padding:10px;text-align:left;font-size:1.05rem}
</style></head><body>
<div class="app">
<h1>🦟 Tangkap Nyamuk! 🦟</h1>

<div id="home">
 <div class="card">
  <div style="font-size:1.3rem">5 kelompok bergiliran. Pilih jawaban yang benar, lalu <b>tap nyamuknya</b>!</div>
  <div class="score" style="margin:12px 0" id="legend"></div>
  <div class="tip">📘 <b>Rumus:</b> subject + be + <b>good at</b> + verb<b>-ing</b><br>Contoh: Rina is good at <b>swimming</b>.<br>Contoh: We are good at <b>singing</b>.</div>
  <div style="margin:12px 0">Jumlah soal:
   <button class="opt on" id="n10" onclick="setN(10)">10 (2 giliran)</button>
   <button class="opt" id="n15" onclick="setN(15)">15 (3 giliran)</button>
  </div>
  <div>20 detik per soal • Benar = +10 poin ⭐</div>
  <button class="btn" onclick="start()">▶️ Mulai Game</button>
 </div>
</div>

<div id="game" class="hide">
 <div class="score" id="score"></div>
 <div class="banner" id="banner"></div>
 <div class="card">
  <div style="font-size:1rem" id="qn"></div>
  <div class="sent" id="sent"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="arena" id="arena"></div>
  <div class="msg" id="msg"></div>
  <button class="btn hide" id="next" onclick="nextQ()">Lanjut ➡️</button>
 </div>
</div>

<div id="end" class="hide">
 <div class="card">
  <div style="font-size:3rem">🏆</div>
  <h2 style="margin:4px 0">Hasil Akhir</h2>
  <div id="rank"></div>
  <button class="btn" onclick="start()">🔁 Main Lagi</button>
 </div>
</div>
</div>

<script>
var G=["#ef4444","#facc15","#16a34a","#3b82f6","#ea580c"],T=["#fff","#23304a","#fff","#fff","#fff"],
N=["Merah","Kuning","Hijau","Biru","Oren"],E=["🔴","🟡","🟢","🔵","🟠"];
var Q=[
["Rina is good at ___ .","swimming",["swim","swims","swam"]],
["Budi is good at ___ .","drawing",["draw","draws","drew"]],
["I am good at ___ .","singing",["sing","sings","sang"]],
["She is good at ___ .","dancing",["dance","dances","danced"]],
["They are good at ___ .","running",["run","runs","ran"]],
["My brother is good at ___ football.","playing",["play","plays","played"]],
["We are good at ___ books.","reading",["read","reads","to read"]],
["Tono is good at ___ .","cooking",["cook","cooks","cooked"]],
["He is good at ___ pictures.","painting",["paint","paints","painted"]],
["You are good at ___ high.","jumping",["jump","jumps","jumped"]],
["Dina is good at ___ stories.","writing",["write","writes","wrote"]],
["My sister is good at ___ a bike.","riding",["ride","rides","rode"]],
["Sari is good at ___ trees.","climbing",["climb","climbs","climbed"]],
["Dodi is good at ___ kites.","flying",["fly","flies","flew"]],
["Tia is good at ___ jokes.","telling",["tell","tells","told"]]
];
var sc,turn,qi,qs,locked,mqs,raf,tm,left,cur,total=10;
function $(i){return document.getElementById(i)}
function show(id){["home","game","end"].forEach(function(x){$(x).classList.toggle("hide",x!=id)})}
function sh(a){return a.slice().sort(function(){return Math.random()-.5})}
function chip(k,act){return '<div class="t'+(act?' act':'')+'" style="background:'+G[k]+';color:'+T[k]+'">'+E[k]+' '+N[k]+'<b>'+(sc?sc[k]:'')+'</b></div>'}
$("legend").innerHTML=N.map(function(n,k){return chip(k,false).replace("<b></b>","")}).join("");
function setN(n){total=n;$("n10").className="opt"+(n==10?" on":"");$("n15").className="opt"+(n==15?" on":"")}
function start(){qs=sh(Q).slice(0,total);sc=[0,0,0,0,0];turn=0;qi=0;show("game");render()}
function board(){$("score").innerHTML=N.map(function(n,k){return chip(k,k==turn)}).join("")}
function render(){
 locked=false;cur=qs[qi];cancelAnimationFrame(raf);clearInterval(tm);board();
 var b=$("banner");b.style.background=G[turn];b.style.color=T[turn];b.textContent="👉 Giliran "+E[turn]+" Kelompok "+N[turn]+"!";
 $("qn").textContent="Soal "+(qi+1)+" dari "+qs.length;
 $("sent").innerHTML=cur[0].replace("___",'<span class="blank" id="bl">&nbsp;&nbsp;&nbsp;?&nbsp;&nbsp;&nbsp;</span>');
 $("msg").textContent="";$("next").classList.add("hide");
 var ar=$("arena");ar.innerHTML="";mqs=[];
 var W=ar.clientWidth;
 sh([cur[1]].concat(cur[2])).forEach(function(w,k){
  var e=document.createElement("div");e.className="mq";
  e.innerHTML='<span class="bug">🦟</span><span class="lab">'+w+'</span>';
  var m={e:e,w:w,x:Math.random()*Math.max(10,W-120),y:20+k*70,vx:(Math.random()<.5?-1:1)*(0.9+Math.random()*0.7),vy:(Math.random()<.5?-1:1)*(0.6+Math.random()*0.6)};
  e.onclick=function(){hit(m)};
  ar.appendChild(e);mqs.push(m);
 });
 fly();left=20;bar(true);
 tm=setInterval(function(){left--;bar();if(left<=0){clearInterval(tm);timeout()}},1000);
}
function bar(f){var b=$("bar");if(f){b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=""}else b.style.width=(left/20*100)+"%"}
function fly(){
 var ar=$("arena"),cw=ar.clientWidth,ch=ar.clientHeight;
 mqs.forEach(function(m){
  var W=cw-m.e.offsetWidth,H=ch-m.e.offsetHeight;
  m.x+=m.vx;m.y+=m.vy;
  if(m.x<0||m.x>W){m.vx*=-1;m.x=Math.max(0,Math.min(W,m.x))}
  if(m.y<0||m.y>H){m.vy*=-1;m.y=Math.max(0,Math.min(H,m.y))}
  m.e.style.transform="translate("+m.x+"px,"+m.y+"px)";
 });
 raf=requestAnimationFrame(fly);
}
function finishQ(){
 locked=true;cancelAnimationFrame(raf);clearInterval(tm);
 mqs.forEach(function(m){if(m.w==cur[1])m.e.classList.add("right")});
 $("bl").textContent=cur[1];board();
 var n=$("next");n.textContent=qi==qs.length-1?"Lihat Hasil 🏆":"Lanjut ➡️";n.classList.remove("hide");
}
function hit(m){
 if(locked)return;
 m.e.classList.add("dead");
 if(m.w==cur[1]){
  sc[turn]+=10;m.e.querySelector(".bug").textContent="💥";
  $("msg").textContent=["🎉 Hebat! Nyamuk tertangkap!","⭐ Benar sekali!","👏 Mantap!"][Math.floor(Math.random()*3)]+" +10";
 }else{
  m.e.querySelector(".bug").textContent="😵";
  $("msg").textContent="Ups, salah! Jawaban: good at "+cur[1]+" 💪";
 }
 finishQ();
}
function timeout(){if(locked)return;$("msg").textContent="⏰ Waktu habis! Jawaban: "+cur[1];finishQ()}
function nextQ(){qi++;turn=(turn+1)%5;if(qi>=qs.length)end();else render()}
function end(){
 show("end");
 var o=[0,1,2,3,4].sort(function(a,b){return sc[b]-sc[a]}),M=["🥇","🥈","🥉","4️⃣","5️⃣"];
 $("rank").innerHTML=o.map(function(k,i){return '<div class="rank" style="background:'+G[k]+';color:'+T[k]+'"><span>'+M[i]+'</span>'+E[k]+' Kelompok '+N[k]+'<b>'+sc[k]+' poin</b></div>'}).join("");
}
</script>
</body></html>
